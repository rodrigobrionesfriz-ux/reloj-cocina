name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: reloj-cocina-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publicar APK como release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RelojCocina.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima RelojCocina.apk --title "Reloj Cocina (última versión)" --notes "Compilado desde ${GITHUB_SHA::7}"
